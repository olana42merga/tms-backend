# SERVER
server.port=8080
# CORS CONFIGURATION
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
# SQL SERVER DATABASE (SQL Server Authentication)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tms_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=MyStrongP@ssw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

# HIKARI CONNECTION POOL
# ============================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# JWT
jwt.secret=taskmanagementsecretkey2024secure
jwt.expiration=86400000
jwt.refresh-expiration=604800000
