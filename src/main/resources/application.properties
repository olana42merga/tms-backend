# ===== SERVER =====
server.port=8080
# REMOVED: server.servlet.context-path=/api
# Now endpoints are at: /auth/login, /tasks, /users, etc.

# ===== CORS CONFIGURATION =====
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ===== MYSQL DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3306/tms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
jwt.secret=taskmanagementsecretkey2024secure
jwt.expiration=86400000
jwt.refresh-expiration=604800000

